name: Python Release

on:
  push:
    branches: ["main"]
    paths:
      - "packages/python-llm-conversation/**"
      - ".github/workflows/python-release.yml"
  pull_request:
    paths:
      - "packages/python-llm-conversation/**"
      - ".github/workflows/python-release.yml"
  workflow_dispatch:

jobs:
  ci-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    environment: env-cicd
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TWINE_USERNAME: __token__
      TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

    defaults:
      run:
        working-directory: packages/python-llm-conversation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: packages/python-llm-conversation/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install hatch twine packaging

      - name: Run tests
        run: python -u -m unittest discover -v -s tests

      - name: Build package
        run: hatch build

      - name: Validate artifacts
        run: python -m twine check dist/*

      - name: Determine version and whether to publish
        id: version
        shell: python
        run: |
          import json
          import os
          import tomllib
          from urllib.error import HTTPError
          from urllib.request import urlopen

          from packaging.version import Version

          with open("pyproject.toml", "rb") as metadata:
              project = tomllib.load(metadata)["project"]
          current = Version(project["version"])
          eligible = (
              os.environ["GITHUB_REF"] == "refs/heads/main"
              and os.environ["GITHUB_EVENT_NAME"] in ("push", "workflow_dispatch")
          )
          latest = None
          publish = False
          if eligible:
              try:
                  with urlopen(f"https://pypi.org/pypi/{project['name']}/json", timeout=30) as response:
                      releases = json.load(response)["releases"]
              except HTTPError as error:
                  if error.code != 404:
                      raise
                  releases = {}
              latest = max((Version(version) for version in releases), default=None)
              publish = latest is None or current > latest

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"current={current}\n")
              output.write(f"latest={latest if latest is not None else ''}\n")
              output.write(f"should_publish={str(publish).lower()}\n")

      - name: Publish to PyPI
        if: steps.version.outputs.should_publish == 'true'
        run: python -m twine upload --non-interactive dist/*

      - name: Report release decision
        if: steps.version.outputs.should_publish != 'true'
        run: |
          echo "Python publish skipped."
          echo "should_publish=${{ steps.version.outputs.should_publish }}"
          echo "current_version=${{ steps.version.outputs.current }}"
          echo "latest_pypi_version=${{ steps.version.outputs.latest }}"