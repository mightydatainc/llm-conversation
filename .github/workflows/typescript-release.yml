name: TypeScript Release

on:
  push:
    branches: ["main"]
    paths:
      - "packages/typescript-llm-conversation/**"
      - ".github/workflows/typescript-release.yml"
  pull_request:
    paths:
      - "packages/typescript-llm-conversation/**"
      - ".github/workflows/typescript-release.yml"
  workflow_dispatch:

jobs:
  ci-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write

    environment: env-cicd
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TWINE_USERNAME: __token__
      TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      
    defaults:
      run:
        working-directory: packages/typescript-llm-conversation

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          # registry-url is required for npm's OIDC Trusted Publishing to work;
          # it tells npm CLI which registry to authenticate against. NODE_AUTH_TOKEN
          # is intentionally not set — auth is handled by the OIDC token via id-token: write.
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
          cache-dependency-path: packages/typescript-llm-conversation/package-lock.json

      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Determine version and whether to publish
        id: version
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_VERSION=$(node -p "require('./package.json').version")

          SHOULD_PUBLISH=false
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            SHOULD_PUBLISH=true
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SHOULD_PUBLISH=true
          fi

          # Treat the version as changed if it is not yet on the registry.
          CHANGED=false
          if [ "${SHOULD_PUBLISH}" = "true" ]; then
            if curl -sf "https://registry.npmjs.org/@mightydatainc/llm-conversation/${CURRENT_VERSION}" > /dev/null 2>&1; then
              CHANGED=false
            else
              CHANGED=true
            fi
          fi

          echo "current=${CURRENT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "changed=${CHANGED}" >> "$GITHUB_OUTPUT"
          echo "should_publish=${SHOULD_PUBLISH}" >> "$GITHUB_OUTPUT"

      - name: Check if version already exists on npm
        id: published
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.version.outputs.should_publish }}" != "true" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION="${{ steps.version.outputs.current }}"
          if curl -sf "https://registry.npmjs.org/@mightydatainc/llm-conversation/${VERSION}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.version.outputs.should_publish == 'true' && steps.version.outputs.changed == 'true' && steps.published.outputs.exists != 'true'
        run: |
          # --provenance is automatic with Trusted Publishing; --ignore-scripts skips redundant prepublishOnly.
          # https://docs.npmjs.com/trusted-publishers#automatic-provenance-generation
          npm publish --access public --ignore-scripts

      - name: Report release decision
        if: steps.version.outputs.should_publish != 'true' || steps.version.outputs.changed != 'true' || steps.published.outputs.exists == 'true'
        run: |
          echo "TypeScript publish skipped."
          echo "should_publish=${{ steps.version.outputs.should_publish }}"
          echo "version_changed=${{ steps.version.outputs.changed }}"
          echo "current_version=${{ steps.version.outputs.current }}"
          echo "already_published=${{ steps.published.outputs.exists }}"
